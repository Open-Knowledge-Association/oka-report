services:
  db:
    image: postgres:16-alpine
    container_name: oka-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - oka_report_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [oka-report]

  api:
    image: oka-report-api:local
    container_name: oka-report-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@oka-report-db:5432/${POSTGRES_DB}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE}
      OUTREACH_ARTICLE_SYNC_SCHEDULE: ${OUTREACH_ARTICLE_SYNC_SCHEDULE}
      OUTREACH_SCHOOL: ${OUTREACH_SCHOOL}
      OUTREACH_SLUG: ${OUTREACH_SLUG}
    depends_on:
      db:
        condition: service_healthy
    networks: [oka-report, integrate]

  worker:
    image: oka-report-api:local
    container_name: oka-report-worker
    restart: unless-stopped
    command: ["./oka-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@oka-report-db:5432/${POSTGRES_DB}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE}
      OUTREACH_ARTICLE_SYNC_SCHEDULE: ${OUTREACH_ARTICLE_SYNC_SCHEDULE}
      OUTREACH_SCHOOL: ${OUTREACH_SCHOOL}
      OUTREACH_SLUG: ${OUTREACH_SLUG}
      WORKER_ID: oka-report-worker
    healthcheck:
      test: ["CMD", "./oka-worker-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks: [oka-report]

  web:
    image: oka-report-web:local
    container_name: oka-report-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:8081:3000"
    depends_on: [api]
    networks: [oka-report, integrate]

volumes:
  oka_report_postgres_data:

networks:
  oka-report:
    name: oka-report
  integrate:
    external: true
