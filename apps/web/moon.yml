language: typescript
tags: ["frontend", "web"]

tasks:
  dev:
    command: "bun run dev"
    description: "Run TanStack Start in development mode"
    options:
      envFile:
        - "/.env"
        - ".env"
      cache: false
      persistent: true
      runInCI: false

  build:
    command: "bun run build"
    outputs:
      - "dist"
    description: "Build frontend for production"
    options:
      envFile:
        - "/.env"
        - ".env"

  preview:
    command: "bun run preview"
    description: "Preview production build"
    deps:
      - "build"
    options:
      cache: false
      persistent: true
      runInCI: false

  test:
    command: "bun run test"
    description: "Run frontend tests with vitest"
    options:
      envFile:
        - "/.env"
        - ".env"
