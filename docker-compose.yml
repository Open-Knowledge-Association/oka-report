services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oka}
      POSTGRES_DB: ${POSTGRES_DB:-oka}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oka}:${POSTGRES_PASSWORD:-oka}@db:5432/${POSTGRES_DB:-oka}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oka}:${POSTGRES_PASSWORD:-oka}@db:5432/${POSTGRES_DB:-oka}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 2 * * *}
      HISTORICAL_BACKFILL_SCHEDULE: ${HISTORICAL_BACKFILL_SCHEDULE:-0 4 * * 0}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["./oka-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oka}:${POSTGRES_PASSWORD:-oka}@db:5432/${POSTGRES_DB:-oka}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 2 * * *}
      OUTREACH_ARTICLE_SYNC_SCHEDULE: ${OUTREACH_ARTICLE_SYNC_SCHEDULE:-0 3 * * *}
      HISTORICAL_BACKFILL_SCHEDULE: ${HISTORICAL_BACKFILL_SCHEDULE:-0 4 * * 0}
      OUTREACH_SCHOOL: ${OUTREACH_SCHOOL:-OKA}
      OUTREACH_SLUG: ${OUTREACH_SLUG:-OKA}
      WORKER_ID: oka-report-worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:3000"
    depends_on:
      - api

volumes:
  postgres_data:
